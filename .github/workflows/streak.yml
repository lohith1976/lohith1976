
name: Update GitHub Streak Stats

on:
  schedule:
    # Run daily at 08:30 AM IST (03:00 UTC)
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/streak-stats.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Streak SVG
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=lohith1976&theme=tokyonight&hide_border=true&background=0D1117&ring=00E5FF&fire=00E5FF&currStreakLabel=00E5FF&sideLabels=00E5FF&dates=8B949E&disable_animations=true&timezone=Asia%2FKolkata
          path: profile/streak.svg

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/streak.svg

          git diff --cached --quiet || (
            git commit -m "Update GitHub streak statistics"
            git push
          )
